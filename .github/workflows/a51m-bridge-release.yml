name: TobiiBridge release

on:
  push:
    tags: ['a51m-bridge-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, created on the dispatched commit if it does not exist (e.g. a51m-bridge-v1.6.3)'
        required: true

permissions:
  contents: write

jobs:
  release:
    # The target machine is an Intel Hackintosh, so build an x86_64 app.
    runs-on: macos-15-intel
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      TOBIIBRIDGE_APP_PATH: ${{ github.workspace }}/release-build/TobiiBridge-Native-v1.6.3.app
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install libusb
        run: brew install libusb

      - name: Check integrated display routing
        run: |
          swiftc a51m-bridge/DisplayRouting.swift a51m-bridge/tools/display-routing-tests.swift -o "$RUNNER_TEMP/tobii-display-tests"
          "$RUNNER_TEMP/tobii-display-tests"

      - name: Build app
        run: |
          zig version
          a51m-bridge/build.sh

      - name: Check smart dim preference persistence
        working-directory: a51m-bridge
        run: |
          python3 tools/smart-dim-persistence-tests.py "$RUNNER_TEMP/SmartDimPersistenceTests.swift"
          swiftc -framework AppKit -framework IOKit -I native \
            "$RUNNER_TEMP/SmartDimPersistenceTests.swift" DisplayRouting.swift -o "$RUNNER_TEMP/smart-dim-tests"
          "$RUNNER_TEMP/smart-dim-tests"
          python3 tools/smart-dim-persistence-tests.py "$RUNNER_TEMP/BrightnessBoundaryTests.swift" --brightness-boundaries
          swiftc -framework AppKit -framework IOKit -I native \
            "$RUNNER_TEMP/BrightnessBoundaryTests.swift" DisplayRouting.swift -o "$RUNNER_TEMP/brightness-boundary-tests"
          "$RUNNER_TEMP/brightness-boundary-tests"

      - name: Package
        run: |
          VERSION="${TAG#a51m-bridge-v}"
          ZIP="TobiiBridge-v${VERSION}-macOS-x86_64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$TOBIIBRIDGE_APP_PATH" "$ZIP"
          shasum -a 256 "$ZIP" | tee "$ZIP.sha256"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Publish release
        run: |
          NOTES="a51m-bridge/release-notes/${TAG}.md"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" "$ZIP.sha256" --clobber
          else
            gh release create "$TAG" "$ZIP" "$ZIP.sha256" --target "$GITHUB_SHA" --title "TobiiBridge ${TAG#a51m-bridge-v}" --notes-file "$NOTES"
          fi
